name: CI

# Se lance à chaque push, sur toutes les branches. Le résultat apparaît aussi sur la PR de la branche.
on:
  push:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint

  prettier:
    name: Prettier
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check

  locales:
    name: Clés de traduction
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm run check:locales

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  unit:
    name: Vitest et couverture
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # Le badge est publié sur la branche badges.
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:coverage
      - name: Écrire le rapport de couverture
        run: node scripts/coverage-report.mjs
      - name: Garder le rapport détaillé
        uses: actions/upload-artifact@v7
        with:
          name: rapport-couverture
          path: coverage
          retention-days: 14
      - name: Publier le badge
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/publish-badge.sh

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Une petite pré-génération suffit à vérifier le build.
      PRERENDER_LIMIT: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

  static:
    name: Site statique
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Le faux PokeAPI évite 1025 appels au vrai service à chaque push.
      NUXT_PUBLIC_POKE_API_BASE: http://localhost:3002
      NUXT_PUBLIC_API_BASE: https://api.exemple.test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lancer le faux PokeAPI
        run: |
          node tests/e2e/mock-pokeapi.mjs &
          curl --fail --silent --retry 10 --retry-connrefused --retry-delay 1 http://localhost:3002/health
      - run: npm run generate
      - run: npm run check:static

  e2e:
    name: Tests e2e (Nuxt, Hono et PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wishlist_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/wishlist_test
    steps:
      # Les deux projets sont rangés côte à côte, comme sur ton ordinateur.
      - uses: actions/checkout@v7
        with:
          path: Inte
      - uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/IIMTest-API
          path: IIMTest-API
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            Inte/package-lock.json
            IIMTest-API/package-lock.json
      - run: npm ci
        working-directory: IIMTest-API
      - run: npm ci
        working-directory: Inte
      - name: Créer la table
        run: psql "$TEST_DATABASE_URL" -f IIMTest-API/db/init.sql
      - name: Installer le navigateur de test
        run: npx playwright install --with-deps chromium
        working-directory: Inte
      - run: npm run test:e2e
        working-directory: Inte
      - name: Garder les traces des tests ratés
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: traces-e2e
          path: Inte/test-results
          retention-days: 7

  audit:
    name: Audit de sécurité
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm audit --omit=dev --audit-level=high

  deploy:
    name: Déploiement Vercel
    # Un merge sur main ne part en ligne que si tous les contrôles sont verts.
    needs: [lint, prettier, locales, typecheck, unit, build, static, e2e, audit]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      # Hors de Vercel, Nuxt ne devine pas la cible : sans ce réglage, il construit un serveur Node.
      NITRO_PRESET: vercel
    steps:
      - name: Signaler si les secrets Vercel manquent
        if: env.VERCEL_TOKEN == ''
        run: echo "Secrets Vercel absents, deploiement ignore."
      - uses: actions/checkout@v7
        if: env.VERCEL_TOKEN != ''
      - uses: actions/setup-node@v7
        if: env.VERCEL_TOKEN != ''
        with:
          node-version: 22
          cache: npm
      - name: Récupérer la configuration Vercel
        if: env.VERCEL_TOKEN != ''
        run: npx --yes vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Construire
        if: env.VERCEL_TOKEN != ''
        run: npx --yes vercel@latest build --prod --token="$VERCEL_TOKEN"
      - name: Mettre en ligne
        if: env.VERCEL_TOKEN != ''
        run: npx --yes vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN"

  deploy-static:
    name: Déploiement S3 et CloudFront
    # Un merge sur main ne part en ligne que si tous les contrôles sont verts.
    needs: [lint, prettier, locales, typecheck, unit, build, static, e2e, audit]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # Permet à GitHub de prouver son identité à AWS, sans clé d'accès à stocker.
      id-token: write
    env:
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
      S3_BUCKET: ${{ secrets.S3_BUCKET }}
      CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
      NUXT_PUBLIC_API_BASE: ${{ vars.API_URL }}
    steps:
      - name: Signaler si les secrets AWS manquent
        if: env.AWS_ROLE_ARN == ''
        run: echo "Secrets AWS absents, deploiement ignore."
      - uses: actions/checkout@v7
        if: env.AWS_ROLE_ARN != ''
      - uses: actions/setup-node@v7
        if: env.AWS_ROLE_ARN != ''
        with:
          node-version: 22
          cache: npm
      - if: env.AWS_ROLE_ARN != ''
        run: npm ci
      - name: Générer le site statique
        if: env.AWS_ROLE_ARN != ''
        run: |
          test -n "$NUXT_PUBLIC_API_BASE" || { echo "La variable API_URL est manquante."; exit 1; }
          npm run generate
      - name: Vérifier le site avant de l'envoyer
        if: env.AWS_ROLE_ARN != ''
        run: npm run check:static
      - name: Se connecter à AWS
        if: env.AWS_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: eu-west-2
      - name: Envoyer les fichiers sur S3
        if: env.AWS_ROLE_ARN != ''
        run: aws s3 sync .output/public "s3://$S3_BUCKET" --delete --no-progress --only-show-errors
      - name: Vider le cache de CloudFront
        if: env.AWS_ROLE_ARN != ''
        run: aws cloudfront create-invalidation --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" --paths "/*"

  smoke:
    name: Contrôle de la production
    # Si une URL critique ne répond pas, la CD passe au rouge.
    needs: [deploy, deploy-static]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      API_URL: ${{ vars.API_URL }}
      SSR_URL: ${{ vars.SSR_URL }}
      SSG_URL: ${{ vars.SSG_URL }}
    steps:
      - name: Signaler si les adresses manquent
        if: env.API_URL == '' || env.SSR_URL == '' || env.SSG_URL == ''
        run: echo "Variables API_URL, SSR_URL ou SSG_URL absentes, controle ignore."
      - uses: actions/checkout@v7
        if: env.API_URL != '' && env.SSR_URL != '' && env.SSG_URL != ''
      - uses: actions/setup-node@v7
        if: env.API_URL != '' && env.SSR_URL != '' && env.SSG_URL != ''
        with:
          node-version: 22
      - name: Vérifier les URL critiques et les codes HTTP
        if: env.API_URL != '' && env.SSR_URL != '' && env.SSG_URL != ''
        run: npm run smoke
      - name: Comparer le HTML SSR et SSG, sans JavaScript
        if: env.API_URL != '' && env.SSR_URL != '' && env.SSG_URL != ''
        run: npm run check:seo
