name: Rollback

# À lancer à la main : onglet Actions, Rollback, Run workflow, sur la branche main.
# Remet la version stable sur Vercel et sur S3. Le prochain merge sur main redéploiera main.
on:
  workflow_dispatch:
    inputs:
      commit:
        description: Commit à restaurer (vide pour le dernier déploiement stable)
        required: false
        type: string

permissions:
  actions: read
  contents: read
  # Permet à GitHub de prouver son identité à AWS, sans clé d'accès à stocker.
  id-token: write

jobs:
  rollback:
    name: Restaurer le site
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
      S3_BUCKET: ${{ secrets.S3_BUCKET }}
      CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      NUXT_PUBLIC_API_BASE: ${{ vars.API_URL }}
      API_URL: ${{ vars.API_URL }}
      SSR_URL: ${{ vars.SSR_URL }}
      SSG_URL: ${{ vars.SSG_URL }}
    steps:
      # Les scripts de contrôle restent ceux de main : une ancienne version peut ne pas les avoir.
      - uses: actions/checkout@v7
      - name: Identifier le dernier déploiement stable
        id: target
        run: bash scripts/find-stable-commit.sh
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_COMMIT: ${{ inputs.commit }}
      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.target.outputs.commit }}
          path: restored
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: restored/package-lock.json
      - name: Remettre la version sur Vercel
        working-directory: restored
        run: |
          npx --yes vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx --yes vercel@latest build --prod --token="$VERCEL_TOKEN"
          npx --yes vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN"
      - name: Générer le site statique
        working-directory: restored
        run: |
          rm -rf .output
          npm ci
          npm run generate
      - name: Vérifier le site avant de l'envoyer
        run: node scripts/check-static.mjs restored/.output/public
      - name: Se connecter à AWS
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: eu-west-2
      - name: Remettre la version sur S3
        run: aws s3 sync restored/.output/public "s3://$S3_BUCKET" --delete --no-progress --only-show-errors
      - name: Vider le cache de CloudFront
        run: aws cloudfront create-invalidation --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" --paths "/*"
      - name: Contrôler la production
        run: node scripts/smoke-test.mjs
      - name: Noter la version restaurée
        env:
          COMMIT: ${{ steps.target.outputs.commit }}
        run: echo "Version restaurée ${COMMIT}" >> "$GITHUB_STEP_SUMMARY"
